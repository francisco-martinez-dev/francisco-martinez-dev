<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinTrack — Panel de Transacciones</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header>
    <div class="header-left">
      <span class="logo">💳 FinTrack</span>
      <span class="subtitle">Panel de Transacciones</span>
    </div>
    <div class="balance-box">
      <span class="balance-label">Saldo disponible</span>
      <span id="balance">$0.00</span>
    </div>
  </header>

  <main>

    <section class="form-section">
      <h2>Nueva transacción</h2>
      <div class="form-group">
        <label for="type">Tipo</label>
        <select id="type">
          <option value="deposit">Depósito</option>
          <option value="withdrawal">Retiro</option>
          <option value="transfer">Transferencia</option>
        </select>
      </div>
      <div class="form-group">
        <label for="description">Descripción</label>
        <input type="text" id="description" placeholder="Ej. Pago de salario" />
      </div>
      <div class="form-group">
        <label for="amount">Monto ($)</label>
        <input type="number" id="amount" min="0.01" step="0.01" placeholder="0.00" />
      </div>
      <button id="addBtn">Registrar transacción</button>
    </section>

    <section class="dashboard-section">

      <div id="alert" class="alert hidden">
        ⚠️ Saldo bajo — su cuenta está por debajo de $100.00
      </div>

      <div class="stats">
        <div class="stat-card deposit">
          <span class="stat-label">Total depósitos</span>
          <span class="stat-value" id="totalDeposits">$0.00</span>
        </div>
        <div class="stat-card withdrawal">
          <span class="stat-label">Total retiros</span>
          <span class="stat-value" id="totalWithdrawals">$0.00</span>
        </div>
        <div class="stat-card transfer">
          <span class="stat-label">Total transferencias</span>
          <span class="stat-value" id="totalTransfers">$0.00</span>
        </div>
      </div>

      <canvas id="chart" width="600" height="200"></canvas>

      <div class="history-header">
        <h2>Historial</h2>
        <div class="filters">
          <button class="filter active" data-filter="all">Todos</button>
          <button class="filter" data-filter="deposit">Depósitos</button>
          <button class="filter" data-filter="withdrawal">Retiros</button>
          <button class="filter" data-filter="transfer">Transferencias</button>
        </div>
      </div>

      <div id="transactionList"></div>

    </section>

  </main>

  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
