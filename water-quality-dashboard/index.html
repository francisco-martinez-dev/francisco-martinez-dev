<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Quality Dashboard — El Salvador</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <h1>💧 Water Quality Dashboard</h1>
    <p>Monitoreo de contaminantes en fuentes de agua — El Salvador</p>
  </header>

  <main>
    <section class="form-section">
      <h2>Registrar muestra</h2>
      <form id="sampleForm">
        <div class="form-group">
          <label for="location">Ubicación</label>
          <input type="text" id="location" placeholder="Ej. Lago de Ilopango" required />
        </div>
        <div class="form-group">
          <label for="date">Fecha</label>
          <input type="date" id="date" required />
        </div>
        <div class="form-group">
          <label for="arsenic">Arsénico (µg/L)</label>
          <input type="number" id="arsenic" step="0.1" min="0" placeholder="Límite OMS: 10" required />
        </div>
        <div class="form-group">
          <label for="lead">Plomo (µg/L)</label>
          <input type="number" id="lead" step="0.1" min="0" placeholder="Límite OMS: 10" required />
        </div>
        <div class="form-group">
          <label for="mercury">Mercurio (µg/L)</label>
          <input type="number" id="mercury" step="0.1" min="0" placeholder="Límite OMS: 6" required />
        </div>
        <button type="submit">Agregar muestra</button>
      </form>
    </section>

    <section class="results-section">
      <h2>Resultados</h2>
      <div id="riskIndicator" class="risk-box hidden">
        <span id="riskLabel"></span>
      </div>
      <canvas id="chart" width="500" height="300"></canvas>
      <div id="recordsTable"></div>
    </section>
  </main>

  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
